  <!--
    Keep adding releases at the BOTTOM of the list:
    kb023, kb024, kb025, ...

    This script reverses them in the DOM so the newest release
    is shown first on the left.
  -->
  <script>
    const cards = document.querySelector('#release-coverflow');

    [...cards.children]
      .reverse()
      .forEach((card) => cards.appendChild(card));

    window.addEventListener('load', () => {
      cards.scrollLeft = 0;
    });
  </script>

  <!--
    Polyfill used as a fallback for browsers without native
    Scroll Timeline / View Timeline support.
