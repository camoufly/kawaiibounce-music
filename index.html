  </main>

  <script>
    const coverflow = document.querySelector('#release-coverflow');

    /*
      Tu continui ad aggiungere le release in fondo:
      kb023, kb024, kb025, ecc.

      Il sito le mostra automaticamente al contrario,
      quindi la più nuova appare per prima.
    */
    [...coverflow.children]
      .reverse()
      .forEach((cover) => coverflow.appendChild(cover));

    /*
      Parte dalla release più nuova.
    */
    window.addEventListener('load', () => {
      coverflow.scrollLeft = 0;
    });
  </script>
