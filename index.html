      <button class="nav nav-next" type="button" aria-label="Next release">&#8250;</button>

  <script>
  (function () {
    const cards = document.querySelector('.cards');
    if (!cards) return;

    /* Newest release first (your original reverse) */
    [...cards.children].reverse().forEach(item => cards.appendChild(item));

    const items    = [...cards.children];
    const scrubber = document.querySelector('.scrubber');
    const titleEl  = document.querySelector('.meta-title');
    const catEl    = document.querySelector('.meta-cat');
    const prevBtn  = document.querySelector('.nav-prev');
    const nextBtn  = document.querySelector('.nav-next');

    if (!items.length) return;

    scrubber.max = items.length - 1;

    /* Does the browser do scroll-driven animations natively? */
    const nativeSDA = window.CSS && CSS.supports && CSS.supports('animation-timeline: view()');
    if (!nativeSDA) document.documentElement.classList.add('no-sda');

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let active = -1;
    let ticking = false;

    function centerIndex() {
      const box = cards.getBoundingClientRect();
      const mid = box.left + box.width / 2;
      let best = 0, bestDist = Infinity;
      items.forEach((li, i) => {
        const r = li.getBoundingClientRect();
        const d = Math.abs(r.left + r.width / 2 - mid);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      return best;
    }

    /* JS fallback for browsers without view timelines (Firefox, older Safari) */
    function paint() {
      const box = cards.getBoundingClientRect();
      const mid = box.left + box.width / 2;
      const w   = items[0].getBoundingClientRect().width || 1;
      const half = (box.width / w) / 2;

      items.forEach(li => {
        const r  = li.getBoundingClientRect();
        const d  = (r.left + r.width / 2 - mid) / w;   /* distance in cover widths */
        const ad = Math.abs(d);
        const sg = Math.sign(d) || 0;

        const face  = Math.min(ad / 0.85, 1);          /* 0 = facing you, 1 = fully turned */
        const pull  = Math.min(Math.max(ad - 0.5, 0) / Math.max(half - 0.5, 0.5), 1);
        const rot   = -sg * 45 * face;
        const tx    = -sg * pull * 100;
        const scale = 1 + 0.25 * (1 - face);
        const tz    = 1 * (1 - face);

        li.style.zIndex = String(100 - Math.round(ad * 10));
        li.firstElementChild.style.transform =
          'translateX(' + tx + '%) rotateY(' + rot + 'deg) translateZ(' + tz + 'em) scale(' + scale + ')';
      });
    }

    function refresh() {
      const i = centerIndex();
      if (i !== active) {
        if (items[active]) items[active].classList.remove('is-active');
        active = i;
        items[active].classList.add('is-active');
        titleEl.textContent = items[active].dataset.title || '';
        catEl.textContent   = items[active].dataset.cat || '';
        if (document.activeElement !== scrubber) scrubber.value = active;
      }
      if (!nativeSDA && !reduced) paint();
    }

    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { ticking = false; refresh(); });
    }

    function goTo(i, behavior) {
      i = Math.max(0, Math.min(items.length - 1, i));
      items[i].scrollIntoView({
        behavior: behavior || (reduced ? 'auto' : 'smooth'),
        inline: 'center',
        block: 'nearest'
      });
    }

    cards.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', () => { active = -1; refresh(); });

    /* First click centers the cover, second click opens the link */
    cards.addEventListener('click', e => {
      const link = e.target.closest('a');
      if (!link) return;
      const i = items.indexOf(link.closest('li'));
      if (i !== active) { e.preventDefault(); goTo(i); }
    });

    /* Tabbing through the covers keeps the focused one centered */
    cards.addEventListener('focusin', e => {
      const li = e.target.closest('li');
      if (li) goTo(items.indexOf(li));
    });

    /* Vertical wheel / trackpad flips through the covers, one at a time */
    let wheelLock = false;
    cards.addEventListener('wheel', e => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      if (Math.abs(e.deltaY) < 4) return;
      e.preventDefault();
      if (wheelLock) return;
      wheelLock = true;
      setTimeout(() => { wheelLock = false; }, 240);
      goTo(active + (e.deltaY > 0 ? 1 : -1));
    }, { passive: false });

    document.addEventListener('keydown', e => {
      if (e.target === scrubber) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(active + 1); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); goTo(active - 1); }
    });

    scrubber.addEventListener('input', () => goTo(Number(scrubber.value), 'auto'));
    prevBtn.addEventListener('click', () => goTo(active - 1));
    nextBtn.addEventListener('click', () => goTo(active + 1));

    /* Wait for the first cover so the centering maths uses real sizes */
    const firstImg = items[0].querySelector('img');
    if (firstImg && !firstImg.complete) firstImg.addEventListener('load', refresh, { once: true });
    refresh();
  })();
  </script>
